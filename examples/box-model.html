<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Example</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 24px; }
    .box {
      width: 280px;
      padding: 24px;       /* space inside the border */
      border: 4px solid #3157a4;
      margin: 24px;        /* space outside the border */
      background: #eaf0ff; /* content background */
    }
  </style>
</head>
<body>
  <h1>The CSS Box Model</h1>
  <div class="box">This is the content area. Inspect the padding, border and margin in your browser's developer tools.</div>
</body>
</html>

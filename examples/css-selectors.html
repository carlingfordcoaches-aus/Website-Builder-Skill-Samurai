<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Selectors Example</title>
  <style>
    /* Element selector: styles every paragraph */
    p {
      line-height: 1.6;
    }

    /* Class selector: styles elements with class="notice" */
    .notice {
      padding: 12px;
      background: #eaf0ff;
      border-left: 4px solid #3157a4;
    }

    /* ID selector: use an ID for one unique element */
    #main-title {
      color: #3157a4;
    }
  </style>
</head>
<body>
  <h1 id="main-title">CSS selectors</h1>
  <p>This paragraph uses the element selector.</p>
  <p class="notice">This paragraph also uses the notice class.</p>
</body>
</html>
